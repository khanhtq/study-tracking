version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: study_xp_tracker_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: study_xp_tracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: study_xp_tracker_redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
