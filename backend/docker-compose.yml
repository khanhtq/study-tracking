services:
  db:
    image: postgres:15-alpine
    container_name: study_xp_tracker_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: study_xp_tracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d study_xp_tracker"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: study_xp_tracker_redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    container_name: study_xp_tracker_azurite
    command: "azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0"
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    volumes:
      - azuritedata:/data

  mailpit:
    image: axllent/mailpit:latest
    container_name: study_xp_tracker_mailpit
    ports:
      - "1025:1025" # SMTP server
      - "8025:8025" # Web UI dashboard
    environment:
      MP_MAX_MESSAGES: 500
      MP_DATABASE: "" # In-memory database

volumes:
  pgdata:
  redisdata:
  azuritedata:
