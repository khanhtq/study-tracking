server:
  port: ${PORT:8080}
  tomcat:
    threads:
      max: 50
      min-spare: 10
    accept-count: 100
    connection-timeout: 5000ms

spring:
  application:
    name: study-xp-tracker
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/study_xp_tracker}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 3
      idle-timeout: 30000
      connection-timeout: 5000
      leak-detection-threshold: 20000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      password: ${SPRING_REDIS_PASSWORD:}
      ssl:
        enabled: ${SPRING_REDIS_SSL_ENABLED:true}
      timeout: 2000ms
  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: ${SPRING_MAIL_STARTTLS_ENABLE:true}
            required: ${SPRING_MAIL_STARTTLS_REQUIRED:false}
          ssl:
            enable: ${SPRING_MAIL_SSL_ENABLE:false}
            trust: ${SPRING_MAIL_HOST:*}

app:
  storage:
    provider: ${STORAGE_PROVIDER:azure} # azure | local | cloudinary
    upload-dir: ${UPLOAD_DIR:uploads}
    max-user-quota-mb: ${MAX_USER_QUOTA_MB:1000} # 1 GB
    max-file-size-mb: ${MAX_FILE_SIZE_MB:200} # 200 MB
    azure:
      connection-string: ${AZURE_STORAGE_CONNECTION_STRING:DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://127.0.0.1:10000/devstoreaccount1;}
      container-name: ${AZURE_STORAGE_CONTAINER_NAME:study-documents}
      sas-expiry-minutes: ${AZURE_STORAGE_SAS_EXPIRY_MINUTES:60}
    cloudinary:
      cloud-name: ${CLOUDINARY_CLOUD_NAME:}
      api-key: ${CLOUDINARY_API_KEY:}
      api-secret: ${CLOUDINARY_API_SECRET:}
  google:
    client-id: ${GOOGLE_CLIENT_ID:your-google-client-id}
  jwt:
    secret: ${JWT_SECRET:9a62aa5c1d2e8b0a701dfc0b2bb2b45a27e7f6e07a3c306dcd37c1527ef94c6f9a62aa5c1d2e8b0a701dfc0b2bb2b45a27e7f6e07a3c306dcd37c1527ef94c6f9}
    expiration-ms: 900000 # 15 minutes (Access Token)
    refresh-expiration-ms: 604800000 # 7 days (Refresh Token)
  xp:
    base-rate-per-minute: 10
    pomodoro-bonus-percentage: 10 # +10% for sessions >= 25 mins
  virtual-users:
    enabled: ${VIRTUAL_USERS_ENABLED:true}
    count: ${VIRTUAL_USERS_COUNT:8}
    rotation-hours: ${VIRTUAL_USERS_ROTATION_HOURS:2}
    auto-reply-enabled: ${VIRTUAL_USERS_AUTO_REPLY_ENABLED:false}

vnpay:
  tmn-code: ${VNPAY_TMN_CODE:DEMO0001}
  hash-secret: ${VNPAY_HASH_SECRET:SECRETKEYDEMO1234567890ABCDEF}
  pay-url: ${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
  return-url: ${VNPAY_RETURN_URL:http://localhost:8080/api/payment/vnpay/return}
  version: 2.1.0
  command: pay

